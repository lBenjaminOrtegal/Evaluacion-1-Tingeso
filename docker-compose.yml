services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: tingeso_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: user_tingeso
      MYSQL_PASSWORD: pass_tingeso
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user_tingeso", "-ppass_tingeso"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: keycloak
    restart: always
    command: start-dev --import-realm
    environment:
      KEYCLOAK_DB: mysql
      KEYCLOAK_DB_URL: jdbc:mysql://db:3306/tingeso_db
      KEYCLOAK_DB_USERNAME: user_tingeso
      KEYCLOAK_DB_PASSWORD: pass_tingeso
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_HTTP_ENABLED: "true"
      KEYCLOAK_HOSTNAME_URL: http://localhost:9090
      KEYCLOAK_HOSTNAME_ADMIN_URL: http://localhost:9090
      KEYCLOAK_PROXY: edge
    ports:
      - "9090:8080"
    volumes:
      - ./imports:/opt/keycloak/data/import
    networks:
      - backend-network
    depends_on:
      db:
        condition: service_healthy

  backend1: &backend_config
    container_name: backend1
    hostname: backend1
    build: ./backend
    image: benjaminoq/ev-1-tingeso-backend
    restart: on-failure
    environment:
      PORT: 8080
      KEYCLOAK_SERVER: keycloak
      KEYCLOAK_PORT: 8080
      KEYCLOAK_REALM: tingeso-1-realm
      KEYCLOAK_ISSUER_URI: http://localhost:9090/realms/tingeso-1-realm
      DB_URL: jdbc:mysql://db:3306/tingeso_db
      DB_USER: user_tingeso
      DB_PASSWORD: pass_tingeso
      KEYCLOAK_CLIENT_ID: tingeso-1-backend
      KEYCLOAK_CLIENT_SECRET: Z5uuNMVdXMPEvzUkYm5jjwadC50gmakA
      TZ: America/Santiago
    expose:
      - "8080"
    networks:
      - backend-network
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  backend2:
    <<: *backend_config
    container_name: backend2
    hostname: backend2

  backend3:
    <<: *backend_config
    container_name: backend3
    hostname: backend3

  frontend1: &frontend_config
    container_name: frontend1
    hostname: frontend1
    build:
      context: ./frontend
      args:
        VITE_BACKEND_SERVER: localhost
        VITE_BACKEND_PORT: "8080"
        VITE_KEYCLOAK_SERVER: localhost
        VITE_KEYCLOAK_PORT: "9090"
        VITE_KEYCLOAK_REALM: tingeso-1-realm
        VITE_KEYCLOAK_CLIENT_ID: tingeso-1-frontend
    image: benjaminoq/ev-1-tingeso-frontend
    restart: on-failure
    networks:
      - frontend-network
    depends_on:
      - nginx-backend
      - keycloak

  frontend2:
    <<: *frontend_config
    container_name: frontend2
    hostname: frontend2

  frontend3:
    <<: *frontend_config
    container_name: frontend3
    hostname: frontend3

  nginx-backend:
    image: nginx:latest
    container_name: nginx-backend
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./nginx-backend.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend-network
      - frontend-network
    depends_on:
      - backend1
      - backend2
      - backend3

  nginx-frontend:
    image: nginx:latest
    container_name: nginx-frontend
    restart: always
    ports:
      - "8070:80"
    volumes:
      - ./nginx-frontend.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-network
    depends_on:
      - frontend1
      - frontend2
      - frontend3

networks:
  frontend-network:
  backend-network:

volumes:
  db_data:
  keycloak_data: