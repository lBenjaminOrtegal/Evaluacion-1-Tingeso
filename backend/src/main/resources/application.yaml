server:
  port: ${PORT}
spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: http://${HOST}:${PORT}/login/oauth2/code/keycloak
        provider:
          keycloak:
            issuer-uri: http://${HOST}:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}
      resourceserver:
        jwt:
          issuer-uri: http://${HOST}:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}