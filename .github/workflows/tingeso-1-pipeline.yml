name: CI/CD Pipeline - Tingeso

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Dar permisos de ejecución al Wrapper
        run: chmod +x gradlew
        working-directory: ./backend

      - name: Ejecutar Pruebas Unitarias (JUnit)
        run: ./gradlew test --no-daemon
        working-directory: ./backend

  build-push-backend:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ev-1-tingeso-backend:latest

  build-push-frontend:
    runs-on: ubuntu-latest
    needs: test-backend 
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          no-cache: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ev-1-tingeso-frontend:latest
          build-args: |
            VITE_BACKEND_SERVER=${{ secrets.VITE_BACKEND_SERVER }}
            VITE_BACKEND_PORT=${{ secrets.VITE_BACKEND_PORT }}
            VITE_KEYCLOAK_SERVER=${{ secrets.VITE_KEYCLOAK_SERVER }}
            VITE_KEYCLOAK_PORT=${{ secrets.VITE_KEYCLOAK_PORT }}
            VITE_KEYCLOAK_REALM=${{ secrets.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}
